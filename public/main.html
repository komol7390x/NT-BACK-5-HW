<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tanlov sahifasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            background: #007bff;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card" onclick="goTo('map')">🗺 Map</div>
        <div class="card" onclick="goTo('chat')">💬 Chat</div>
        <div class="card" onclick="goTo('notification')">🔔 Notification</div>
    </div>

    <script>
        function goTo(page) {
            if (page === "map") {
                window.location.href = "public/map.html";
            } else if (page === "chat") {
                window.location.href = "/chat.html";
            } else if (page === "notification") {
                window.location.href = "/notification.html";
            }
        }
    </script>
</body>

</html>
