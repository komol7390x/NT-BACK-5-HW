<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notification Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9fafb;
            padding: 20px;
        }
    
        h2 {
            margin-bottom: 10px;
        }
    
        #messages {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            height: 220px;
            overflow: auto;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
    
        #messages p {
            background: #f3f4f6;
            margin: 6px 0;
            padding: 8px 10px;
            border-radius: 6px;
        }
    
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
    
        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <h2>📢 Notifications</h2>
    <div id="messages" style="border:1px solid #ccc; height:200px; overflow:auto; padding:8px;"></div>
    <input id="msg" type="text" placeholder="Type message" />
    <button onclick="send()">Send</button>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:3003');
        const box = document.getElementById('messages');
        const input = document.getElementById('msg');

        socket.on('notification', (msg) => {
            const p = document.createElement('p');
            p.textContent = '🔔 ' + msg;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        });

        function send() {
            if (!input.value) return;
            socket.emit('notification', input.value);
            input.value = '';
        }
    </script>
</body>

</html>
