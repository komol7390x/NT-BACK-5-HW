syntax = "proto3";

package product;

message Product {
    int32 id = 1;
    string name = 2;
    float price = 3;
    int32 storeId = 4;
}

message ProductId {
    int32 id = 1;
}

message StoreId {
    int32 storeId = 1;
}

message ProductList {
    repeated Product products = 1;
}

message Empty {}

message CreateProductDto {
    string name = 1;
    float price = 2;
    int32 storeId = 3;
}

message UpdateProductDto {
    int32 id = 1;
    optional string name = 2;
    optional float price = 3;
    optional int32 storeId = 4;
}

service ProductService {
    rpc CreateProduct (CreateProductDto) returns (Product);
    rpc FindAll (Empty) returns (ProductList);
    rpc FindOne (ProductId) returns (Product);
    rpc UpdateProduct (UpdateProductDto) returns (Product);
    rpc Remove (ProductId) returns (Empty);
    rpc FindByStoreId (StoreId) returns (ProductList);
}