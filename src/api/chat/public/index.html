<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        #messageList {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 5px;
            list-style: none;
        }
    
        #messageList li {
            margin: 4px 0;
            padding: 6px;
            background: #f1f1f1;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <input type="text" id="messageInput" placeholder="Xabar yozing...">
    <button onclick="sendMessage()">Send message</button>
    <ul id="messageList"></ul>

    <script>
        const socket = io('http://192.168.68.72:3003');

        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            if (message.trim() === "") return;
            socket.emit('chat-message', message);
            document.getElementById('messageInput').value = "";
        }

        function appendMessage(msg) {
            const li = document.createElement('li');
            li.textContent = msg;
            const messageList = document.getElementById('messageList');
            messageList.appendChild(li);

            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        socket.on('chat-message', (message) => appendMessage(message));
        socket.on('user-join', (message) => appendMessage(message));
        socket.on('user-left', (message) => appendMessage(message));
    </script>
</body>

</html>
