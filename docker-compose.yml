services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: my_app
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "${PORT}:4004"
    command: sh -c "sleep 5 && npm run start:dev"

volumes:
  pgdata:
