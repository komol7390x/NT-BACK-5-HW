  }
}
# ----------------- POST -----------------
# create
mutation {
  createPost(
    createPostInput: {
      title: "Film A"
      description: "Ajoyib film"
      price: 12000
      quantity: 10
      userId: 4
    }
  ) {
    id
    title
    description
    price
    quantity
    User {
      id
      name
    }
  }
}

# findall
query {
  posts {
    id
    title
    description
    price
    quantity
    User {
      id
      name
      email
    }
  }
}

# findOne
query{
  post(id:5){
    id
    User{
      id
    }
  }
}

