# ----------------- USER -----------------
#  create
mutation {
  createUser(
    createUserInput: {
      name: "Komol"
      email: "example@gmail.com"
      age: 25
      password: "@Komol1234!@#"
    }
  ) {
    id
    name
    email
    age
  }
}
# getall
query {
  users {
    id
    name
    email
    age
    post {
      id
      title
      description
    }
  }
}
# get one
query {
  user (id:1) {
    id
    name
    email
    age
    post {
      id
      title
      description
    }
  }
}

# update

mutation {
  updateUser(
    updateUserInput: {
